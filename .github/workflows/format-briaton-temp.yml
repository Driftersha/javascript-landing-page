name: Format Briaton branch (temporary)

on:
  push:
    branches:
      - briaton-template-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format source
        run: npx prettier --write .
      - name: Commit formatting to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "briaton-template-hardening"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git add index.html checkout.html product.html tests js README.md privacy.html personal-data.html
            git commit -m "style: apply Prettier to Briaton template"
            git push origin HEAD:briaton-template-hardening
          fi
