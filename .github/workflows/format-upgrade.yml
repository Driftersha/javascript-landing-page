name: Format Briaton upgrade
on:
  push:
    branches: [upgrade/briaton-experience]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write index.html css/template.css js/main.js js/components/Basket.js js/components/cartToast.js js/components/pageEnhancements.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/template.css js/main.js js/components/Basket.js js/components/cartToast.js js/components/pageEnhancements.js
          git diff --cached --quiet || (git commit -m "style: format Briaton upgrade" && git push)
