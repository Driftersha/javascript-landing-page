<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Демонстрационная карточка товара каталога светотехники Briaton."
    />
    <title>Товар — Briaton (демо)</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/template.css" />
  </head>
  <body>
    <a class="skip-link" href="#product">Перейти к товару</a>
    <header class="header">
      <div class="container">
        <div class="header__top">
          <a
            href="./index.html"
            class="header__logo-link"
            aria-label="Briaton — главная"
          >
            <svg
              class="header__icon"
              width="140"
              height="26"
              aria-hidden="true"
            >
              <use href="images/sprite.svg#icon-logo"></use>
            </svg>
          </a>
          <a href="./index.html#catalog" class="btn">Вернуться в каталог</a>
          <div class="header__right">
            <ul class="header__user-list">
              <li class="header__user-item">
                <button
                  class="header__user-btn"
                  type="button"
                  aria-expanded="false"
                  aria-controls="product-basket"
                >
                  <span class="header__user-text">Корзина</span>
                  <svg
                    class="header__user-icon"
                    width="24"
                    height="24"
                    aria-hidden="true"
                  >
                    <use href="images/sprite.svg#icon-basket"></use>
                  </svg>
                  <span class="header__user-count">0</span>
                </button>
                <div class="header__basket basket" id="product-basket">
                  <ul class="basket__list"></ul>
                  <a class="basket__link btn" href="./checkout.html"
                    >Перейти к оформлению</a
                  >
                  <div class="basket__empty-block">Корзина пока пуста</div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main id="product" class="product-page container">
      <nav aria-label="Навигация">
        <a class="product-page__back" href="./index.html#catalog"
          >← Каталог светотехники</a
        >
      </nav>
      <p class="template-notice" role="note">
        Демонстрационный каталог — не настоящий интернет-магазин.
      </p>
      <div
        class="product-page__grid"
        data-product-detail
        aria-live="polite"
      ></div>
    </main>
    <footer class="footer">
      <div class="container">
        <p>
          Демонстрационный проект Briaton. Реальные заказы и оплата недоступны.
        </p>
        <a class="footer__policy-link" href="./index.html">На главную</a>
      </div>
    </footer>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
